; ── supervisord.conf ─────────────────────────────────────────────────────────
; Runs FastAPI + Celery worker inside a single HF Space container.
;
; Both processes share the same image and codebase under /code.
; supervisord acts as PID 1 (nodaemon=true) so Docker/HF Spaces tracks it.
; ─────────────────────────────────────────────────────────────────────────────

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=10MB
logfile_backups=0
pidfile=/tmp/supervisord.pid
loglevel=info

; ── FastAPI (uvicorn) ─────────────────────────────────────────────────────────
; HF Space requires port 7860. Internal URL: http://localhost:7860
[program:fastapi]
command=uvicorn app.main:app --host 0.0.0.0 --port 7860 --workers 1
directory=/code
autostart=true
autorestart=true
priority=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Celery Worker ────────────────────────────────────────────────────────────
; concurrency=1 keeps RAM below HF free-tier limit (~16 GB but CPU-bound).
; --without-gossip/mingle/heartbeat → kills 3 extra CloudAMQP connections,
; keeping total connections within the free plan's 20-connection cap.
[program:celery]
command=celery -A app.worker.celery_app worker
        --loglevel=info
        --concurrency=1
        --without-gossip
        --without-mingle
        --without-heartbeat
        --queues=celery
directory=/code
autostart=true
autorestart=true
priority=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
